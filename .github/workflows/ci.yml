name: CI

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'

jobs:
  lint:
    name: Lint (ktlint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck --no-daemon

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Spin up a Postgres service so the jOOQ gradle plugin can run
    # `generateJooq` against a real database. We initialize the schema with
    # `src/test/resources/ci-schema.sql` (only the tables/columns the
    # production code imports — see header in that file).
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cocoa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cocoa_test
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # docs-and-plan#231: lets the DB-backed tests (e.g. HistoryRepositoryDbTest)
      # run against this job's throwaway database. A separate name from
      # SPRING_DATASOURCE_URL on purpose, so a shell pointed at a real database
      # never runs them by accident.
      COCOA_CI_SCHEMA_JDBC_URL: jdbc:postgresql://localhost:5432/cocoa_test
      COCOA_CI_SCHEMA_USER: postgres
      COCOA_CI_SCHEMA_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "waiting for postgres..."; sleep 2;
          done

      - name: Initialize test schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d cocoa_test \
            -f src/test/resources/ci-schema.sql

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            build/reports/tests/test/**
            build/test-results/test/**

  # docs-and-plan#255: the DB tests that need the REAL schema (constraints,
  # defaults, PostGIS -- e.g. RecurrenceRepositoryDbTest) and so are skipped
  # by the test job above, whose database is only ci-schema.sql's few tables.
  # Builds a fresh database from the database repo's full migration chain,
  # the same way that repo's own migrate-check does, then runs *DbTest.
  db-test:
    name: DB tests (full schema)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # 17, matching the database repo's migrate-check (and Neon): V1's
        # dump sets transaction_timeout, which only exists from Postgres 17.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cocoa_full
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # jOOQ is generated from this same full-schema database.
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cocoa_full
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      COCOA_FULL_SCHEMA_JDBC_URL: jdbc:postgresql://localhost:5432/cocoa_full
      COCOA_FULL_SCHEMA_USER: postgres
      COCOA_FULL_SCHEMA_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A PR that needs a new migration usually has a branch of the same name
      # in the database repo; use it when it exists, dev otherwise.
      - name: Pick the database branch
        id: dbref
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/Cocoa-CUSAR-dev/database.git "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout migrations (Cocoa-CUSAR-dev/database@${{ steps.dbref.outputs.ref }})
        uses: actions/checkout@v4
        with:
          repository: Cocoa-CUSAR-dev/database
          ref: ${{ steps.dbref.outputs.ref }}
          path: database

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "waiting for postgres..."; sleep 2;
          done

      - name: Build the full schema (flyway migrate)
        run: |
          docker run --rm --network host             -v "${{ github.workspace }}/database/migrations:/flyway/sql"             flyway/flyway:10-alpine             -url=jdbc:postgresql://localhost:5432/cocoa_full             -user=postgres -password=postgres             migrate

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run the full-schema DB tests
        run: ./gradlew test --tests "*DbTest" --no-daemon

      # Fails the job if the tests were skipped instead of run -- a renamed env
      # var would otherwise turn this into a green no-op.
      - name: Check they really ran
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          ran = skipped = 0
          for path in glob.glob("build/test-results/test/TEST-*RecurrenceRepositoryDbTest.xml"):
              root = ET.parse(path).getroot()
              ran += int(root.get("tests", 0)) - int(root.get("skipped", 0))
              skipped += int(root.get("skipped", 0))
          print(f"RecurrenceRepositoryDbTest: {ran} ran, {skipped} skipped")
          sys.exit(0 if ran > 0 and skipped == 0 else 1)
          PY

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: db-test-results-${{ github.run_id }}
          path: |
            build/reports/tests/test/**
            build/test-results/test/**

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, test, db-test]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cocoa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cocoa_test
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Wait for Postgres
        run: until pg_isready -h localhost -p 5432 -U postgres; do echo "waiting..."; sleep 2; done

      - name: Initialize test schema
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d cocoa_test -f src/test/resources/ci-schema.sql

      - name: Build (compile + test + jar)
        run: ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: cocoa-jar
          path: build/libs/cocoa.jar
          if-no-files-found: ignore
