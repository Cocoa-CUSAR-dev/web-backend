name: CD

# Render is connected directly to this repo (its own Git integration) and
# auto-deploys from `auto-deploy` on every push -- no deploy step needed here.
# This workflow just builds+tests so a broken push is visible in the Actions
# tab even though it isn't what blocks Render from deploying.
on:
  push:
    branches: '**'
  workflow_dispatch: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Needed so the jOOQ gradle plugin can run `generateJooq` against a real
    # database during the build. Same setup as the `build` job in ci.yml.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cocoa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cocoa_test
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Wait for Postgres
        run: until pg_isready -h localhost -p 5432 -U postgres; do echo "waiting..."; sleep 2; done

      - name: Initialize test schema
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d cocoa_test -f src/test/resources/ci-schema.sql

      - name: Build (compile + test + jar)
        run: ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: cocoa-jar
          path: build/libs/cocoa.jar
          if-no-files-found: error
