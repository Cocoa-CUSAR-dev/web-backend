name: CD

# TODO: deploy target not decided yet. Currently triggers on push to `main`
# and manual dispatch, builds the jar, and stops. Fill in the `deploy` job
# once the target is confirmed (Render deploy hook / SSH / Docker registry / etc).
on:
  push:
    branches: '**'
  workflow_dispatch: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Needed so the jOOQ gradle plugin can run `generateJooq` against a real
    # database during the build. Same setup as the `build` job in ci.yml.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cocoa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cocoa_test
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Wait for Postgres
        run: until pg_isready -h localhost -p 5432 -U postgres; do echo "waiting..."; sleep 2; done

      - name: Initialize test schema
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d cocoa_test -f src/test/resources/ci-schema.sql

      - name: Build (compile + test + jar)
        run: ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: cocoa-jar
          path: build/libs/cocoa.jar
          if-no-files-found: error

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Deploy (not configured yet)
        run: |
          echo "TODO: no deploy target configured yet."
          echo "Options once decided:"
          echo "  - Render: curl -fsS -X POST \"\$RENDER_DEPLOY_HOOK_URL\" (store hook URL as a repo secret)"
          echo "  - SSH: scp the jar to the server, then restart the systemd service"
          echo "  - Docker: build+push an image to a registry, then pull on the host"
          echo "See build.gradle.kts / README.md 'Build & deploy' section for the jar output path."
