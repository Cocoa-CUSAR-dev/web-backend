# Test profile. Used by @SpringBootTest classes via @ActiveProfiles("test").
# Spring Boot picks this file up automatically because it lives in
# src/test/resources and ends with -test.properties.
#
# We point the application at H2 in PostgreSQL-compat mode so the jOOQ
# auto-configuration can build a DSLContext bean at context-startup without
# trying to connect to a real Postgres. The test classes then replace the
# repository beans with @MockBean, so no SQL is actually executed against H2.

spring.datasource.url=jdbc:h2:mem:cocoa-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximumPoolSize=5
spring.datasource.hikari.minimumIdle=1
spring.datasource.hikari.idleTimeout=30000

# Required by application.properties bindings
spring.application.name=web
server.servlet.context-path=/api/v1
server.port=0

# JwtProperties binding values (used at @ConfigurationProperties binding time)
jwt.key=test-jwt-key-must-be-at-least-32-bytes-long-for-hs256-signing
jwt.name=jwt-test
jwt.access-token-expiration=36000000
jwt.refresh-token-expiration=86400000

# springdoc defaults
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# CORS — allow everything in tests
cors.origins=*
