spring.application.name=${SPRING_APPLICATION_NAME}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximumPoolSize=${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE}
spring.datasource.hikari.minimumIdle=${SPRING_DATASOURCE_HIKARI_MIN_IDLE}
spring.datasource.hikari.idleTimeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT}

server.servlet.context-path=${SERVER_CONTEXT_PATH}
server.port=${SERVER_PORT}

jwt.key=${JWT_KEY}
jwt.name=${JWT_NAME}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}

springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.api-docs.path=${API_DOCS_PATH:/api-docs}