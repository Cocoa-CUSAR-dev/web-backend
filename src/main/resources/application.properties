spring.application.name=${SPRING_APPLICATION_NAME}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximumPoolSize=${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE}
spring.datasource.hikari.minimumIdle=${SPRING_DATASOURCE_HIKARI_MIN_IDLE}
spring.datasource.hikari.idleTimeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT}
# idleTimeout above only recycles connections ABOVE minimumIdle -- the
# minimumIdle connections themselves are otherwise only recycled by Hikari's
# own maxLifetime default (30 min), which is longer than Neon's pooler
# endpoint keeps an idle server-side connection open. Without these, a
# pooled connection goes stale, looks fine to Hikari, and the next query on
# it just hangs (surfaces as a client-side timeout minutes later, e.g. the
# chatbot's own httpx call to /service/forms times out at 30s while Kotlin
# is still stuck). keepaliveTime pings idle connections before that happens;
# maxLifetime is a shorter backstop, comfortably under Neon's own timeout.
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:240000}
spring.datasource.hikari.keepalive-time=${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:120000}

server.servlet.context-path=${SERVER_CONTEXT_PATH}
server.port=${SERVER_PORT}

jwt.key=${JWT_KEY}
jwt.name=${JWT_NAME}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}

cookie.secure=${COOKIE_SECURE:true}

chatbot-service.key=${CHATBOT_SERVICE_KEY:}

# X-2d: error tracking. Blank DSN (the default) disables the SDK entirely --
# no crash, no events sent -- so this is safe to leave unset in local dev/CI.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:local}
# Traces/profiling cost quota on Sentry's free tier; error capture alone
# doesn't need either, so both stay off unless someone deliberately opts in.
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.0}

springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.api-docs.path=${API_DOCS_PATH:/api-docs}